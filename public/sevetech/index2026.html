<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Georgia&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --ink: #292929;
    --ink-soft: #6b6b6b;
    --paper: #fdfdfb;
    --rule: #e8e6df;
    --accent: #FF6719;
  }
  html { -webkit-text-size-adjust: 100%; }
  body {
    max-width: 40rem;
    margin: 0 auto;
    padding: 3rem 1.5rem 5rem;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", Cambria, serif;
    font-size: 1.125rem;
    line-height: 1.68;
    word-wrap: break-word;
  }
  h1, h2, h3, h4 {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin-top: 2.2em;
    margin-bottom: 0.5em;
  }
  h1 { font-size: 1rem; margin-top: 0; }
  h2 { font-size: 1.5rem; padding-top: 0.75rem; border-top: 1px solid var(--rule); }
  h3 { font-size: 1.2rem; }
 p {
  margin: 1.1em 0;
  text-align: justify;
  text-align-last: left;
}
  a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 2px; }
  a:hover { color: var(--accent); }
  blockquote {
    margin: 1.5em 0;
    padding-left: 1.1em;
    border-left: 3px solid var(--accent);
    font-style: italic;
    color: var(--ink-soft);
  }
  strong { font-weight: 700; }
  hr { border: none; border-top: 1px solid var(--rule); margin: 2.5em 0; }
  code { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 0.92em; background: rgba(0,0,0,0.05); padding: 0.15em 0.35em; border-radius: 4px; }
  img, svg, table, pre { max-width: 100%; height: auto; }
  img { border-radius: 6px; }
  pre { overflow-x: auto; padding: 1em; background: rgba(0,0,0,0.04); border-radius: 6px; }
  pre code { background: none; padding: 0; }
  table { display: block; overflow-x: auto; white-space: nowrap; border-collapse: collapse; }
  th, td { padding: 0.5em 0.9em; border-bottom: 1px solid var(--rule); text-align: left; }
  ::selection { background: rgba(255,103,25,0.2); }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8e6e1;
      --ink-soft: #a3a29c;
      --paper: #1b1b1a;
      --rule: #333230;
    }
    code { background: rgba(255,255,255,0.08); }
    pre { background: rgba(255,255,255,0.06); }
  }
  @media (max-width: 480px) {
    body { padding: 2rem 1.1rem 4rem; font-size: 1.05rem; }
    h1 { font-size: 1.65rem; }
    h2 { font-size: 1.3rem; }
  }
</style>
<title>SeveTech Blog 2026</title>
</head>
<body>
<h1>Blog 2026</h1>
<ul>
<li><a href="index_card_productivity.html">Index Card Productivity</a></li>
</ul>
</body>
</html>
